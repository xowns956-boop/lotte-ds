<!-- Lotte Kendo DS · PageTab (열린 화면 탭 줄)
     화면 맨 아래에 놓는다. 고른 탭 = aria-selected="true" 하나.
     X(닫기)는 빼도 된다. 누르면 close 이벤트만 오고, 탭을 지우는 건 쓰는 쪽에서 한다.
     맨 끝 안내 글자는 탭이 0개일 때만 보인다(빈 상태). -->

<div class="ux-page-tabs" role="tablist" aria-label="열린 화면">
  <div class="ux-page-tab">
    <button type="button" class="ux-page-tab-link" role="tab" aria-selected="false">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      <span class="ux-page-tab-text">작업지시</span>
    </button>
    <button type="button" class="ux-page-tab-close" aria-label="작업지시 닫기">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="ux-page-tab">
    <button type="button" class="ux-page-tab-link" role="tab" aria-selected="true">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      <span class="ux-page-tab-text">원료 입고</span>
    </button>
    <button type="button" class="ux-page-tab-close" aria-label="원료 입고 닫기">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <p class="ux-page-tabs-empty">열린 화면이 없어요</p>
</div>
