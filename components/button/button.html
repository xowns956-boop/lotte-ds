<!-- Lotte Kendo DS · Button
     variant 클래스 하나 + 크기 클래스 하나를 .k-button에 붙인다.
     variant: k-button-solid-primary(주 동작, 화면당 1개) · k-button-solid-error · k-button-outline-base
              k-button-solid-secondary · k-button-flat-base · k-button-link-primary
     크기: k-button-sm · k-button-md · k-button-lg · k-icon-button
     비활성: disabled 속성 (button이 아닌 요소는 aria-disabled="true") -->

<!-- 글자만 -->
<button type="button" class="k-button k-button-md k-button-solid-primary">
  <span class="k-button-text">저장</span>
</button>

<!-- 왼쪽 아이콘 + 글자 (Show Icon Left) -->
<button type="button" class="k-button k-button-md k-button-outline-base">
  <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  <span class="k-button-text">추가</span>
</button>

<!-- 글자 + 오른쪽 아이콘 (Show Icon Right) -->
<button type="button" class="k-button k-button-md k-button-outline-base">
  <span class="k-button-text">더보기</span>
  <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
</button>

<!-- 아이콘만: 글자가 없으니 aria-label 필수 -->
<button type="button" class="k-button k-icon-button k-button-outline-base" aria-label="추가">
  <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
</button>

<!-- 비활성 -->
<button type="button" class="k-button k-button-md k-button-solid-primary" disabled>
  <span class="k-button-text">저장</span>
</button>
