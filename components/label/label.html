<!-- Lotte Kendo DS · Label
     입력칸과 for ↔ id로 잇는다.
     필수: 라벨 앞 빨간 점(.k-required) + 입력칸에 required
     비활성: .k-state-disabled -->

<label class="k-label" for="lot-no">LOT NO</label>

<label class="k-label" for="qty"><span class="k-required" aria-hidden="true"></span>수량</label>
<input id="qty" type="text" class="k-textbox k-input k-input-md" required>

<label class="k-label k-state-disabled" for="wc">워크센터</label>
