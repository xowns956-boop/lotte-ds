<!-- Lotte Kendo DS · Toast · Inline 알림

     Toast: 화면에 직접 쓰지 않고 스크립트로 띄운다(4초 뒤 사라짐, 오른쪽 아래).
       LotteDS.toast({ type: 'success', title: '저장되었습니다', description: '2026-09-23 14:30' });
       type: (생략=default) · success · info · warning · error / 되돌리기: action: '실행 취소', onAction: 함수
       결과 알림에만 쓴다. "~창을 엽니다" 같은 자리채움 알림은 쓰지 않는다.

     Inline: 화면 안에 붙박이로 두는 안내 상자. 폭은 놓이는 자리를 채운다. -->

<div class="ux-alert" role="note">
  <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
  <div class="ux-alert-text">
    <p class="ux-alert-title">알림</p>
    <p class="ux-alert-description">확인이 필요한 내용이 있습니다.</p>
  </div>
</div>

<!-- 오류 안내: ux-alert-error + role="alert"(바로 읽힘) -->
<div class="ux-alert ux-alert-error" role="alert">
  <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
  <div class="ux-alert-text">
    <p class="ux-alert-title">저장하지 못했습니다</p>
    <p class="ux-alert-description">LOT NO를 확인하고 다시 저장해 주세요.</p>
  </div>
</div>
