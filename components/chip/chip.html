<!-- Lotte Kendo DS · Chip (적용된 조회 조건)
     문구는 "조건명 · 값". X는 조건을 지우는 버튼 → aria-label에 무엇을 지우는지.
     X를 눌렀을 때 조건을 지우고 칩을 없애는 일은 화면 스크립트가 한다. -->

<span class="k-chip k-chip-md">
  <span class="k-chip-content"><span class="k-chip-label">품목 · 냉동면</span></span>
  <span class="k-chip-actions">
    <button type="button" class="k-chip-action k-chip-remove-action" aria-label="품목 조건 해제">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </span>
</span>
