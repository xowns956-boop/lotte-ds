<!-- Lotte Kendo DS · AppBar (화면 맨 위 머리줄)
     화면 맨 위, 폭 전체. 왼쪽 = 메뉴 토글 · 이 화면 즐겨찾기 ☆ · 화면 제목(h1) + 작은 경로, 오른쪽 = 검색 · 즐겨찾기 목록 · 사용자.
     화면 제목은 여기 h1 하나. 본문에 제목(PageHeading)을 또 두지 않는다.
     안에 든 것은 전부 기존 부품(Drawer / Toggle · Separator · Breadcrumb · Input(InputGroup) · Kbd · Drawer / User).
     빼도 되는 칸: 토글+구분선 · ☆ · 작은 경로 · 검색 · 아이콘 버튼(ghost) · 사용자. 제목 없이 경로 줄만 두는 예전 구조도 된다(첫 칸 = 홈 아이콘) -->

<header class="k-appbar ux-appbar">
  <div class="k-appbar-section">
    <button type="button" class="k-button k-button-flat-base k-icon-button ux-drawer-toggle" data-drawer-toggle="app-drawer" aria-expanded="true" aria-controls="app-drawer" aria-label="메뉴 펼치기·접기">
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <span class="k-separator k-separator-vertical" role="separator" aria-orientation="vertical"></span>
    <button type="button" class="k-toggle-button ux-toggle-sm ux-appbar-favorite" aria-pressed="false" aria-label="작업 지시 즐겨찾기"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></button>
    <div class="ux-appbar-titles">
      <h1 class="ux-appbar-title">작업 지시</h1>
      <nav class="k-breadcrumb ux-appbar-crumb" aria-label="현재 위치">
        <ol class="k-breadcrumb-container">
          <li class="k-breadcrumb-item"><a class="k-breadcrumb-link" href="#">MES</a></li>
          <li class="ux-breadcrumb-separator" aria-hidden="true"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m9 18 6-6-6-6"/></svg></li>
          <li class="k-breadcrumb-item"><a class="k-breadcrumb-link" href="#">생산관리</a></li>
          <li class="ux-breadcrumb-separator" aria-hidden="true"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m9 18 6-6-6-6"/></svg></li>
          <li class="k-breadcrumb-item"><span class="k-breadcrumb-link" aria-current="page">PP-010</span></li>
        </ol>
      </nav>
    </div>
  </div>
  <span class="k-appbar-spacer"></span>
  <div class="k-appbar-section">
    <span class="k-textbox ux-appbar-search">
      <span class="k-input-prefix"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
      <input class="k-input-inner" type="search" placeholder="메뉴 · 화면 검색" aria-label="메뉴 · 화면 검색">
      <span class="k-input-suffix"><kbd class="ux-kbd-group"><kbd class="ux-kbd">⌘</kbd><kbd class="ux-kbd">K</kbd></kbd></span>
    </span>
    <button type="button" class="k-button k-button-flat-base k-icon-button" aria-label="즐겨찾기 목록" data-tooltip="즐겨찾기 목록"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></button>
    <div class="ux-drawer-user">
      <span class="k-avatar k-avatar-circle" aria-hidden="true"><span class="k-avatar-text">관</span></span>
      <div class="ux-drawer-user-text">
        <p class="ux-drawer-user-name">사용자 이름</p>
        <p class="ux-drawer-user-email">시스템 관리자</p>
      </div>
      <svg class="k-svg-icon ux-drawer-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
    </div>
  </div>
</header>
