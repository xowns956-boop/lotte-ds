<!-- Lotte Kendo DS · Grid (표)
     머리칸 th.k-header + scope="col". 줄 높이·글자는 기기 모드를 따른다.
     칸 종류: 흐린 글자 td.k-color-subtle · 숫자 td.k-text-right · 체크박스 열 .k-checkbox-column · 가운데 체크 .k-text-center · 줄 메뉴 .k-command-cell
     고른 줄: tr에 aria-selected="true" (또는 .k-selected) / 빈 표: tr.k-grid-norecords
     정렬 머리칸: th에 aria-sort, 안에 button.k-link(글자 + arrow-up-down). 정렬하는 일은 화면 스크립트가 한다. -->

<div class="k-grid">
  <table class="k-grid-table">
    <thead class="k-grid-header">
      <tr>
        <th class="k-header k-checkbox-column" scope="col"><input type="checkbox" class="k-checkbox" aria-label="전체 선택"></th>
        <th class="k-header" scope="col"><span class="k-required" aria-hidden="true"></span>품목코드</th>
        <th class="k-header" scope="col" aria-sort="none">
          <button type="button" class="k-link">품명
            <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
          </button>
        </th>
        <th class="k-header k-text-right" scope="col">수량</th>
        <th class="k-header k-command-cell" scope="col"><span class="k-sr-only">메뉴</span></th>
      </tr>
    </thead>
    <tbody>
      <tr class="k-master-row" aria-selected="false">
        <td class="k-checkbox-column"><input type="checkbox" class="k-checkbox" aria-label="100001 선택"></td>
        <td>100001</td>
        <td>냉동면 4호</td>
        <td class="k-text-right">1,250</td>
        <td class="k-command-cell">
          <button type="button" class="k-button k-icon-button k-button-flat-base k-button-sm" aria-label="100001 메뉴">
            <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 빈 표 -->
<div class="k-grid">
  <table class="k-grid-table">
    <thead class="k-grid-header"><tr><th class="k-header" scope="col">품목코드</th><th class="k-header" scope="col">품명</th></tr></thead>
    <tbody><tr class="k-grid-norecords"><td colspan="2">표시할 데이터가 없습니다</td></tr></tbody>
  </table>
</div>
