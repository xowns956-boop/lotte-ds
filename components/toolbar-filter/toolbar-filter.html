<!-- Lotte Kendo DS · Toolbar / Filter (필터바)
     표(Grid) 바로 위에 붙이는 조회 조건 한 줄. 칸은 전부 기존 부품.
     빼도 되는 칸: 검색 · 필터 1 · 필터 2 · 날짜 · 초기화. 필터 칸은 라벨 대신 aria-label을 꼭 단다.
     초기화를 눌렀을 때 값을 지우는 건 쓰는 쪽에서 한다. -->

<div class="ux-toolbar-filter" role="search" aria-label="조회 조건">
  <input type="search" class="k-textbox k-input k-input-md ux-toolbar-filter-search" placeholder="검색" aria-label="검색">
  <div class="k-dropdownlist k-picker k-picker-md">
    <button type="button" class="k-input-inner" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="flt-line-list" aria-label="라인">
      <span class="k-input-value-text">전체</span>
      <span class="k-input-button" aria-hidden="true"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <div class="k-popup k-list-container" hidden>
      <ul class="k-list-ul" role="listbox" id="flt-line-list" aria-label="라인"><li class="k-list-item" role="option" aria-selected="true" data-value=""><span class="k-list-item-text">전체</span></li><li class="k-list-item" role="option" aria-selected="false" data-value="A1"><span class="k-list-item-text">조립 1라인</span></li><li class="k-list-item" role="option" aria-selected="false" data-value="A2"><span class="k-list-item-text">조립 2라인</span></li></ul>
    </div>
    <input type="hidden" name="flt-line" value="">
  </div>
  <div class="k-dropdownlist k-picker k-picker-md">
    <button type="button" class="k-input-inner" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="flt-status-list" aria-label="상태">
      <span class="k-input-value-text">전체</span>
      <span class="k-input-button" aria-hidden="true"><svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <div class="k-popup k-list-container" hidden>
      <ul class="k-list-ul" role="listbox" id="flt-status-list" aria-label="상태"><li class="k-list-item" role="option" aria-selected="true" data-value=""><span class="k-list-item-text">전체</span></li><li class="k-list-item" role="option" aria-selected="false" data-value="wait"><span class="k-list-item-text">대기</span></li><li class="k-list-item" role="option" aria-selected="false" data-value="run"><span class="k-list-item-text">진행</span></li><li class="k-list-item" role="option" aria-selected="false" data-value="done"><span class="k-list-item-text">완료</span></li></ul>
    </div>
    <input type="hidden" name="flt-status" value="">
  </div>
  <div class="ux-datepicker" data-ux-datepicker>
    <button type="button" class="k-button k-button-md k-button-outline-base ux-datepicker-trigger" aria-haspopup="dialog" aria-expanded="false" data-empty>
      <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      <span class="ux-datepicker-value">날짜 선택</span>
    </button>
    <input type="hidden" name="workDate">
    <div class="k-calendar-container k-popup" role="dialog" aria-label="날짜 선택" hidden>
      <div class="k-calendar" data-ux-calendar></div>
    </div>
  </div>
  <button type="button" class="k-button k-button-md k-button-flat-base">
    <span class="k-button-text">초기화</span>
    <svg class="k-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
</div>
