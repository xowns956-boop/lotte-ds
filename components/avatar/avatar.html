<!-- Lotte Kendo DS · Avatar
     사진이 없으면 이니셜 한 글자(fallback), 있으면 사진(image). 사진에는 사람 이름을 alt로.
     이니셜만 있을 때 화면 읽기용 이름이 필요하면 바깥에 aria-label. -->

<span class="k-avatar k-avatar-circle" role="img" aria-label="관리자"><span class="k-avatar-text" aria-hidden="true">관</span></span>

<span class="k-avatar k-avatar-circle"><span class="k-avatar-image"><img src="photo.jpg" alt="홍길동"></span></span>
